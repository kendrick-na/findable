  </text>
  <rect x="116" y="292" width="126" height="10" rx="5" fill="#FF7A4D"/>

  <!-- Findable F. badge: same two-color construction as the approved badge concept -->
  <rect x="1115" y="165" width="420" height="420" rx="102" fill="#FF7A4D"/>
  <g transform="translate(1196 246) scale(10.3)">
    <text x="1.5" y="25.5"
          font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
          font-size="30" font-weight="400" fill="#F7F1E6">F</text>
    <rect x="21.2" y="21.5" width="4.3" height="4.3" fill="#F7F1E6"/>
  </g>

  <text x="112" y="820" fill="#9FB2BF"
        font-family="'Pretendard', 'Apple SD Gothic Neo', Arial, sans-serif"
        font-size="27" font-weight="500" letter-spacing="1">
