<svg width="1672" height="941" viewBox="0 0 1672 941" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Findable Insights thumbnail template v1</title>
  <desc>16:9 Findable blog thumbnail with title area and F. badge.</desc>
  <rect width="1672" height="941" fill="#102A43"/>
  <rect x="0" y="0" width="1672" height="941" fill="#102A43"/>

  <!-- Quiet editorial background structure -->
  <path d="M 1080 0 H 1672 V 941 H 1065 C 1195 785 1223 625 1198 470 C 1173 311 1128 153 1080 0 Z" fill="#173B59"/>
  <path d="M 1115 0 H 1672 V 941 H 1265 C 1320 760 1316 567 1268 380 C 1228 224 1170 87 1115 0 Z" fill="#1C4665"/>

  <!-- Replaceable article title area -->
  <text x="112" y="150" fill="#F7F1E6"
        font-family="'Pretendard', 'Apple SD Gothic Neo', Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="-2">
    AI 검색 최적화:
  </text>
  <text x="112" y="225" fill="#F7F1E6"
        font-family="'Pretendard', 'Apple SD Gothic Neo', Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="-2">
