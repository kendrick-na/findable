<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Findable F. badge concept v1</title>
  <desc>Findable serif F mark with square dot inside an orange rounded-square badge.</desc>
  <rect x="64" y="64" width="896" height="896" rx="214" fill="#FF7A4D"/>

  <!-- Findable's existing serif F. identity, reversed to warm ivory on orange -->
  <text x="512" y="676"
        text-anchor="middle"
        font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
        font-size="360"
        font-weight="400"
        letter-spacing="-18"
        fill="#F7F1E6">F</text>
  <rect x="644" y="565" width="42" height="42" fill="#F7F1E6"/>
</svg>
